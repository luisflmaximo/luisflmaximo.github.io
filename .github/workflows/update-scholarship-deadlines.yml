name: Atualizar prazos das bolsas

on:
  schedule:
    - cron: "17 7 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholarship-deadlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o site
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Consultar fontes oficiais
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_scholarship_deadlines.py

      - name: Guardar intervalos confirmados
        run: |
          if git diff --quiet -- secret/tools-data.json; then
            echo "Sem alterações confirmadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secret/tools-data.json
          git commit -m "chore: atualizar prazos das bolsas"
          git push
